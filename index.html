<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CALEQ</title>

    <meta name="description" content="Centro Acadêmico de Engenharia Química">

    <style>
        /* ============================================================
           CALEQ — ESTILOS
           ============================================================ */

        :root {
            --preto: #0a0a0a;
            --preto-2: #111111;
            --cinza-escuro: #1a1a1a;
            --cinza: #777777;
            --cinza-claro: #d9d9d9;
            --branco: #f5f5f0;
            --branco-puro: #ffffff;

            --fonte-principal: Arial, Helvetica, sans-serif;
            --fonte-mono: "Courier New", Courier, monospace;

            --largura: 1400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--branco);
            color: var(--preto);
            font-family: var(--fonte-principal);
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        /* ============================================================
           BARRA SUPERIOR
           ============================================================ */

        .top-bar {
            background: var(--preto);
            color: var(--branco);
            padding: 8px 30px;
            font-family: var(--fonte-mono);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .top-bar-inner {
            max-width: var(--largura);
            margin: auto;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        /* ============================================================
           HEADER
           ============================================================ */

        header {
            background: var(--branco);
            border-bottom: 1px solid var(--preto);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: var(--largura);
            margin: auto;
            min-height: 82px;
            padding: 0 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: max-content;
        }

        .logo-symbol {
            width: 44px;
            height: 44px;
            border: 2px solid var(--preto);

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: var(--fonte-mono);
            font-size: 14px;
            font-weight: bold;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo-subtitle {
            font-family: var(--fonte-mono);
            font-size: 9px;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 22px;
        }

        nav a {
            font-family: var(--fonte-mono);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;

            padding: 8px 0;
            border-bottom: 1px solid transparent;

            transition: 0.2s ease;
        }

        nav a:hover {
            border-bottom-color: var(--preto);
        }

        .menu-button {
            display: none;
            background: none;
            border: 1px solid var(--preto);
            padding: 10px 14px;
            cursor: pointer;
            font-family: var(--fonte-mono);
            font-weight: bold;
        }

        /* ============================================================
           ESTRUTURA GERAL
           ============================================================ */

        section {
            scroll-margin-top: 90px;
        }

        .container {
            max-width: var(--largura);
            margin: auto;
            padding: 0 30px;
        }

        .section {
            padding: 110px 0;
            border-bottom: 1px solid var(--preto);
        }

        .section-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 50px;
            margin-bottom: 70px;
        }

        .section-number {
            font-family: var(--fonte-mono);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .section-title {
            font-size: clamp(42px, 7vw, 100px);
            line-height: 0.9;
            letter-spacing: -5px;
            text-transform: uppercase;
        }

        .section-description {
            max-width: 700px;
            margin-top: 25px;

            font-size: 18px;
            line-height: 1.6;
        }

        /* ============================================================
           HERO
           ============================================================ */

        .hero {
            min-height: calc(100vh - 130px);
            display: flex;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    var(--branco) 0%,
                    var(--branco) 65%,
                    #deded8 65%,
                    #deded8 100%
                );

            border-bottom: 1px solid var(--preto);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.6fr;
            gap: 50px;
            align-items: end;
            width: 100%;
        }

        .hero-label {
            font-family: var(--fonte-mono);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: clamp(80px, 17vw, 260px);
            line-height: 0.72;
            letter-spacing: -14px;
            font-weight: 900;
        }

        .hero-text {
            max-width: 620px;
            margin-top: 50px;
            font-size: 19px;
            line-height: 1.55;
        }

        .hero-side {
            border-left: 1px solid var(--preto);
            padding-left: 30px;
        }

        .hero-side-number {
            font-family: var(--fonte-mono);
            font-size: 90px;
            line-height: 0.8;
            margin-bottom: 30px;
        }

        .hero-side p {
            font-family: var(--fonte-mono);
            font-size: 12px;
            line-height: 1.7;
            text-transform: uppercase;
        }

        .hero-button {
            display: inline-flex;
            margin-top: 35px;
            padding: 16px 24px;

            background: var(--preto);
            color: var(--branco);

            font-family: var(--fonte-mono);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;

            transition: 0.2s ease;
        }

        .hero-button:hover {
            background: var(--cinza-escuro);
            transform: translateY(-2px);
        }

        /* ============================================================
           QUEM SOMOS
           ============================================================ */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .about-card {
            border: 1px solid var(--preto);
            padding: 35px;
            min-height: 260px;
        }

        .about-card-number {
            font-family: var(--fonte-mono);
            font-size: 12px;
            margin-bottom: 60px;
        }

        .about-card h3 {
            font-size: 30px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .about-card p {
            font-size: 15px;
            line-height: 1.7;
        }

        /* ============================================================
           DIRETORIA
           ============================================================ */

        .members-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--preto);
            border-left: 1px solid var(--preto);
        }

        .member {
            min-height: 240px;
            padding: 25px;

            border-right: 1px solid var(--preto);
            border-bottom: 1px solid var(--preto);

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .member-number {
            font-family: var(--fonte-mono);
            font-size: 11px;
        }

        .member-name {
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .member-role {
            font-family: var(--fonte-mono);
            font-size: 11px;
            text-transform: uppercase;
        }

        /* ============================================================
           PROJETOS
           ============================================================ */

        .projects {
            border-top: 1px solid var(--preto);
        }

        .project {
            display: grid;
            grid-template-columns: 100px 1fr 80px;
            gap: 30px;
            align-items: center;

            padding: 30px 0;
            border-bottom: 1px solid var(--preto);

            transition: 0.2s ease;
        }

        .project:hover {
            padding-left: 15px;
            padding-right: 15px;
            background: var(--preto);
            color: var(--branco);
        }

        .project-number {
            font-family: var(--fonte-mono);
            font-size: 12px;
        }

        .project-name {
            font-size: 34px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .project-arrow {
            text-align: right;
            font-size: 25px;
        }

        /* ============================================================
           NOTÍCIAS / AVISOS
           ============================================================ */

        .news-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .news-card {
            border: 1px solid var(--preto);
            padding: 30px;
        }

        .news-date {
            font-family: var(--fonte-mono);
            font-size: 11px;
            margin-bottom: 45px;
        }

        .news-card h3 {
            font-size: 28px;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .news-card p {
            line-height: 1.6;
            font-size: 14px;
        }

        /* ============================================================
           CONTATO
           ============================================================ */

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .contact-title {
            font-size: clamp(45px, 7vw, 100px);
            line-height: 0.85;
            letter-spacing: -5px;
            text-transform: uppercase;
        }

        .contact-info {
            border-top: 1px solid var(--preto);
        }

        .contact-item {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--preto);
        }

        .contact-label {
            font-family: var(--fonte-mono);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .contact-value {
            font-size: 17px;
        }

        .contact-value a {
            border-bottom: 1px solid var(--preto);
        }

        /* ============================================================
           REDES SOCIAIS
           ============================================================ */

        .social-section {
            background: var(--preto);
            color: var(--branco);
        }

        .social-section .section-number {
            color: #aaa;
        }

        .social-section .section-title {
            color: var(--branco);
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .social-link {
            border: 1px solid #555;
            padding: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            font-family: var(--fonte-mono);
            font-size: 12px;
            text-transform: uppercase;

            transition: 0.2s ease;
        }

        .social-link:hover {
            background: var(--branco);
            color: var(--preto);
        }

        /* ============================================================
           FOOTER
           ============================================================ */

        footer {
            background: var(--preto);
            color: var(--branco);
            padding: 60px 0 30px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
            padding-bottom: 70px;
        }

        .footer-logo {
            font-size: 90px;
            line-height: 0.8;
            letter-spacing: -6px;
            font-weight: 900;
        }

        .footer-description {
            max-width: 450px;
            margin-top: 30px;

            font-family: var(--fonte-mono);
            font-size: 11px;
            line-height: 1.7;
            text-transform: uppercase;
            color: #aaa;
        }

        .footer-column-title {
            font-family: var(--fonte-mono);
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .footer-column a {
            display: block;
            color: #aaa;
            font-family: var(--fonte-mono);
            font-size: 11px;
            margin-bottom: 10px;
        }

        .footer-column a:hover {
            color: var(--branco);
        }

        .footer-bottom {
            padding-top: 20px;
            border-top: 1px solid #444;

            display: flex;
            justify-content: space-between;
            gap: 20px;

            color: #888;
            font-family: var(--fonte-mono);
            font-size: 10px;
            text-transform: uppercase;
        }

        /* ============================================================
           RESPONSIVO
           ============================================================ */

        @media (max-width: 900px) {

            .header-inner {
                min-height: 70px;
            }

            .menu-button {
                display: block;
            }

            nav {
                display: none;
                position: absolute;
                left: 0;
                right: 0;
                top: 70px;

                background: var(--branco);
                border-bottom: 1px solid var(--preto);

                padding: 20px 30px;

                flex-direction: column;
                align-items: flex-start;
            }

            nav.active {
                display: flex;
            }

            .hero-grid,
            .section-header,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                min-height: auto;
                padding: 100px 0;
            }

            .hero-side {
                border-left: none;
                border-top: 1px solid var(--preto);
                padding-left: 0;
                padding-top: 30px;
            }

            .members-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .social-grid {
                grid-template-columns: 1fr;
            }

            .footer-grid {
                grid-template-columns: 1fr 1fr;
            }

            .footer-logo {
                font-size: 70px;
            }
        }

        @media (max-width: 600px) {

            .top-bar-inner {
                flex-direction: column;
                gap: 4px;
            }

            .header-inner {
                padding: 0 20px;
            }

            .container {
                padding: 0 20px;
            }

            .section {
                padding: 75px 0;
            }

            .section-title {
                letter-spacing: -3px;
            }

            .hero h1 {
                letter-spacing: -8px;
            }

            .about-grid,
            .news-grid,
            .members-grid {
                grid-template-columns: 1fr;
            }

            .project {
                grid-template-columns: 50px 1fr 30px;
                gap: 15px;
            }

            .project-name {
                font-size: 22px;
            }

            .contact-item {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .footer-grid {
                grid-template-columns: 1fr;
            }

            .footer-bottom {
                flex-direction: column;
            }
        }
    </style>
</head>

    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->

    <script>

        /* ============================================================
           FUNÇÃO AUXILIAR
           ============================================================ */

        function selecionar(id) {
            return document.getElementById(id);
        }


        /* ============================================================
           IDENTIDADE
           ============================================================ */

        selecionar("topNome").textContent =
            SITE.nomeCompleto;

        selecionar("logoSymbol").textContent =
            SITE.logo;

        selecionar("logoNome").textContent =
            SITE.nome;

        selecionar("logoSubtitulo").textContent =
            "ENGENHARIA QUÍMICA";


        /* ============================================================
           MENU PRINCIPAL
           ============================================================ */

        const menu = selecionar("menu");

        SITE.menu.forEach(item => {

            const link = document.createElement("a");

            link.href = item.link;

            link.textContent = item.nome;

            link.addEventListener("click", () => {
                menu.classList.remove("active");
            });

            menu.appendChild(link);

        });


        /* ============================================================
           MENU MOBILE
           ============================================================ */

        selecionar("menuButton").addEventListener(
            "click",
            () => {

                menu.classList.toggle("active");

            }
        );


        /* ============================================================
           HERO
           ============================================================ */

        selecionar("heroEtiqueta").textContent =
            SECOES.inicio.etiqueta;

        selecionar("heroTitulo").textContent =
            SECOES.inicio.titulo;

        selecionar("heroNumero").textContent =
            SECOES.inicio.numero;

        selecionar("heroTexto").textContent =
            SECOES.inicio.texto;

        selecionar("heroDescricao").textContent =
            SITE.descricaoCurta;

        selecionar("heroBotao").textContent =
            SECOES.inicio.botao;

        selecionar("heroBotao").href =
            SECOES.inicio.botaoLink;


        /* ============================================================
           QUEM SOMOS
           ============================================================ */

        selecionar("quemNumero").textContent =
            SECOES.quemSomos.numero;

        selecionar("quemTitulo").textContent =
            SECOES.quemSomos.titulo;

        selecionar("quemDescricao").textContent =
            SECOES.quemSomos.descricao;


        const aboutGrid = selecionar("aboutGrid");

        SECOES.quemSomos.cards.forEach(card => {

            const div = document.createElement("div");

            div.className = "about-card";

            div.innerHTML = `

                <div class="about-card-number">
                    ${card.numero}
                </div>

                <h3>
                    ${card.titulo}
                </h3>

                <p>
                    ${card.texto}
                </p>

            `;

            aboutGrid.appendChild(div);

        });


        /* ============================================================
           DIRETORIA
           ============================================================ */

        selecionar("diretoriaNumero").textContent =
            SECOES.diretoria.numero;

        selecionar("diretoriaTitulo").textContent =
            SECOES.diretoria.titulo;

        selecionar("diretoriaDescricao").textContent =
            SECOES.diretoria.descricao;


        const membersGrid =
            selecionar("membersGrid");


        SECOES.diretoria.membros.forEach(
            (membro, index) => {

                const div =
                    document.createElement("div");

                div.className = "member";

                div.innerHTML = `

                    <div class="member-number">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                    <div class="member-name">
                        ${membro.nome}
                    </div>

                    <div class="member-role">
                        ${membro.cargo}
                    </div>

                `;

                membersGrid.appendChild(div);

            }
        );


        /* ============================================================
           PROJETOS
           ============================================================ */

        selecionar("projetosNumero").textContent =
            SECOES.projetos.numero;

        selecionar("projetosTitulo").textContent =
            SECOES.projetos.titulo;

        selecionar("projetosDescricao").textContent =
            SECOES.projetos.descricao;


        const projectsList =
            selecionar("projectsList");


        SECOES.projetos.itens.forEach(
            (projeto, index) => {

                const div =
                    document.createElement("div");

                div.className = "project";

                div.title = projeto.descricao;

                div.innerHTML = `

                    <div class="project-number">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                    <div class="project-name">
                        ${projeto.nome}
                    </div>

                    <div class="project-arrow">
                        →
                    </div>

                `;

                projectsList.appendChild(div);

            }
        );


        /* ============================================================
           AVISOS
           ============================================================ */

        selecionar("avisosNumero").textContent =
            SECOES.avisos.numero;

        selecionar("avisosTitulo").textContent =
            SECOES.avisos.titulo;

        selecionar("avisosDescricao").textContent =
            SECOES.avisos.descricao;


        const newsGrid =
            selecionar("newsGrid");


        SECOES.avisos.noticias.forEach(
            noticia => {

                const div =
                    document.createElement("article");

                div.className = "news-card";

                div.innerHTML = `

                    <div class="news-date">
                        ${noticia.data}
                    </div>

                    <h3>
                        ${noticia.titulo}
                    </h3>

                    <p>
                        ${noticia.texto}
                    </p>

                `;

                newsGrid.appendChild(div);

            }
        );


        /* ============================================================
           CONTATO
           ============================================================ */

        selecionar("contatoNumero").textContent =
            SECOES.contato.numero;

        selecionar("contatoTitulo").textContent =
            SECOES.contato.titulo;

        selecionar("contatoDescricao").textContent =
            SECOES.contato.descricao;


        /* Instagram */

        const contatoInstagram =
            selecionar("contatoInstagram");

        contatoInstagram.textContent =
            SITE.instagram.nome;

        contatoInstagram.href =
            SITE.instagram.link;


        /* E-mail */

        const contatoEmail =
            selecionar("contatoEmail");

        if (SITE.email.endereco.trim() !== "") {

            contatoEmail.innerHTML = `
                <a href="mailto:${SITE.email.endereco}">
                    ${SITE.email.endereco}
                </a>
            `;

        } else {

            contatoEmail.textContent =
                SITE.email.texto;

        }


        /* Telefone */

        const contatoTelefone =
            selecionar("contatoTelefone");

        if (SITE.telefone.numero.trim() !== "") {

            contatoTelefone.innerHTML = `
                <a href="tel:${SITE.telefone.numero}">
                    ${SITE.telefone.numero}
                </a>
            `;

        } else {

            contatoTelefone.textContent =
                SITE.telefone.texto;

        }


        /* Endereço */

        selecionar("contatoEndereco").textContent =
            SITE.endereco.texto;


        /* ============================================================
           REDES SOCIAIS
           ============================================================ */

        const socialGrid =
            selecionar("socialGrid");


        SITE.redesSociais.forEach(rede => {

            const a =
                document.createElement("a");

            a.className = "social-link";

            a.href = rede.link;

            a.target = "_blank";

            a.rel = "noopener";

            a.innerHTML = `

                <span>
                    ${rede.nome}
                </span>

                <span>
                    ${rede.texto}
                    →
                </span>

            `;

            socialGrid.appendChild(a);

        });


        /* ============================================================
           FOOTER
           ============================================================ */

        selecionar("footerLogo").textContent =
            SITE.nome;


        selecionar("footerDescricao").textContent =
            SITE.rodape.texto;


        /* Menu do rodapé */

        const footerMenu =
            selecionar("footerMenu");


        SITE.menu.forEach(item => {

            const a =
                document.createElement("a");

            a.href = item.link;

            a.textContent = item.nome;

            footerMenu.appendChild(a);

        });


        /* Instagram */

        const footerInstagram =
            selecionar("footerInstagram");

        footerInstagram.textContent =
            SITE.instagram.nome;

        footerInstagram.href =
            SITE.instagram.link;


        /* E-mail */

        const footerEmail =
            selecionar("footerEmail");


        if (SITE.email.endereco.trim() !== "") {

            footerEmail.textContent =
                SITE.email.endereco;

            footerEmail.href =
                "mailto:" + SITE.email.endereco;

        } else {

            footerEmail.textContent =
                SITE.email.texto;

            footerEmail.removeAttribute("href");

        }


        /* Telefone */

        const footerTelefone =
            selecionar("footerTelefone");


        if (SITE.telefone.numero.trim() !== "") {

            footerTelefone.textContent =
                SITE.telefone.numero;

            footerTelefone.href =
                "tel:" + SITE.telefone.numero;

        } else {

            footerTelefone.textContent =
                SITE.telefone.texto;

            footerTelefone.removeAttribute("href");

        }


        /* Copyright */

        selecionar("footerCopyright").textContent =
            `© ${SITE.rodape.ano} ${SITE.nome} — TODOS OS DIREITOS RESERVADOS`;


    </script>
